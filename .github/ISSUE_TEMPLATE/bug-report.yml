name: 程序错误
description: 报告可重复出现的页面或程序问题（仅限虚构数据）
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 复现信息和截图不含真实患者信息、密码、Cookie、密钥或机构敏感网络信息
          required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构病例，逐步说明点击和选择内容。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与错误提示
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      placeholder: "例如 Windows 11 / Edge；Android 平板 / Chrome"
    validations:
      required: true
