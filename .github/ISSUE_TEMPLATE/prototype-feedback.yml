name: 原型体验反馈
description: 提交工作流、界面、匹配结果或改进建议（仅限虚构病例）
title: "[原型反馈] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: "请勿填写或上传任何真实患者信息、账号、密码、Cookie、病历、照片或影像。"
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 本 Issue 及附件只包含虚构数据，不含可识别患者信息或密钥
          required: true
  - type: dropdown
    id: category
    attributes:
      label: 反馈类型
      options: [工作流程, 页面与易用性, 处方匹配, 打印或导出, 局域网访问, 其他建议]
    validations:
      required: true
  - type: input
    id: test-input
    attributes:
      label: 虚构测试组合
      placeholder: "例如 CASE-DEMO-01 / M01 / F2 / A2 / M"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果或改进建议
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: 影响程度
      options: [阻断使用, 重要问题, 一般问题, 优化建议]
    validations:
      required: true
