name: Build CARE-Rx mobile hosting artifact

on:
  workflow_dispatch:
  push:
    branches: [agent/mobile-hosting]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cloudflare
      - uses: actions/upload-artifact@v4
        with:
          name: care-rx-open-next
          path: |
            .open-next
            .openai/hosting.json
          include-hidden-files: true
          if-no-files-found: error
