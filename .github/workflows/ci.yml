name: CARE-Rx safety checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate clinical data and safety prototype
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Validate clinical data contracts
        shell: pwsh
        run: .\scripts\validate-clinical-data.ps1

      - name: Run zero-dependency prototype tests
        shell: pwsh
        run: .\scripts\test-prototype.ps1

      - name: Type-check application
        shell: pwsh
        run: pnpm typecheck

      - name: Build production application
        shell: pwsh
        run: pnpm build

      - name: Confirm no clinical JSON is marked approved
        shell: pwsh
        run: |
          $matches = Get-ChildItem clinical-data,test-cases -Recurse -File -Filter *.json |
            Select-String -Pattern '"status"\s*:\s*"approved"','"reviewStatus"\s*:\s*"approved"','"decision"\s*:\s*"approved"'
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_ }
            throw 'Clinical JSON contains approved content without a committed review workflow.'
          }
